name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # actions/setup-python v5.3.0
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install uv==0.11.19
      - name: Checkout the verified Aelix host revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: handochan/aelix-ai
          ref: 402a801325dcc335e2b7e1a7e829e9b5ebed93ca
          path: .devstate/aelix-host
          persist-credentials: false
      - name: Install extension and host
        run: |
          uv sync --locked --python "${{ matrix.python }}"
          uv pip install .devstate/aelix-host/packages/aelix-ai \
            .devstate/aelix-host/packages/aelix-agent-core \
            .devstate/aelix-host/packages/aelix-coding-agent
      - name: Lint and types
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync pyright
      - name: Test actual HTTP boundaries and host integration
        run: uv run --no-sync pytest -q -W error::ResourceWarning
      - name: Build from sdist
        run: uv build
      - name: Verify installed wheel at the real host boundary
        run: uv run --no-sync python scripts/verify_host.py --aelix-source .devstate/aelix-host
